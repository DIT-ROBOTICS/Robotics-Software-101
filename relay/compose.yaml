# Run from the top of the repository:  docker compose -f relay/compose.yaml up -d --build
# With the Cloudflare tunnel (a domain + HTTPS):  add --profile tunnel, and put the token in relay/.env
# After a git pull, run the same command again to publish the new pages.
services:
  dit-courses:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    container_name: dit-courses
    restart: always
    ports:
      - "80:8080"   # the site on the LAN; change the left number to serve on another port

  # Brings the domain (e.g. courses.ditrobotics.com) to this container. In the Cloudflare
  # dashboard, give the tunnel's public hostname the service  http://dit-courses:8080
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.4.0
    container_name: dit-courses-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # from relay/.env (never commit it)
    depends_on: [dit-courses]
